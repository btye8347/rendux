name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.26"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --group dev

      - name: Lint RDL layouts (strict)
        run: uv run python scripts/lint_rdl.py config/views.yaml

      - name: Run tests
        run: uv run pytest tests/ -q

      - name: Agent RDL eval harness
        run: uv run python scripts/vibe_test.py

      - name: Strict render smoke (ops layout)
        env:
          RENDUX_STRICT: "1"
        run: uv run python scripts/smoke_strict_ops.py
