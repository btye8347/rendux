name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.26"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --group dev

      - name: Lint RDL layouts (strict)
        run: uv run python scripts/lint_rdl.py config/views.yaml

      - name: Run tests
        run: uv run pytest tests/ -q

      - name: Strict render smoke (ops layout)
        run: RENDUX_STRICT=1 uv run python -c "
        import os, yaml
        from pathlib import Path
        from jinja2 import Environment, FileSystemLoader
        from rendux.core.layout import LayoutRenderer
        root = Path('.')
        ops = yaml.safe_load((root/'config/views.yaml').read_text())['views']['ops']
        env = Environment(loader=FileSystemLoader(str(root/'rendux/templates')), autoescape=True)
        LayoutRenderer(env, strict=os.environ.get('RENDUX_STRICT')=='1').render(
            ops['workspace']['layout'], ops['data'])
        print('strict ops render OK')
        "
