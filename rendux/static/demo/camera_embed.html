<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Stream embed</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #0b1220;
        color: #9fb3c8;
        font: 14px/1.4 ui-sans-serif, system-ui, sans-serif;
        display: grid;
        place-items: center;
      }
      .box {
        text-align: center;
        padding: 1.5rem;
      }
      .label {
        font-size: 0.7rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #5b7a99;
        margin-bottom: 0.5rem;
      }
      .title {
        color: #e8f1ff;
        font-size: 1.05rem;
        margin: 0 0 0.35rem;
      }
      .hint { margin: 0; font-size: 0.85rem; }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="label">iframe embed</div>
      <p class="title">go2rtc / Frigate live</p>
      <p class="hint">Host supplies the real player URL.</p>
    </div>
  </body>
</html>
