layout:
  - type: grid
    columns: 4
    children:
      - widget: stat_card
        each: "$ctx.kpi"
        label: "$item.label"
        value: "$item.value"
        status: "$item.status"
        trend: "$item.trend"
        subtitle: "$item.subtitle"

context:
  kpi:
    - label: Active Services
      value: "24"
      status: ok
      trend: "+2 today"
    - label: Open Alerts
      value: "3"
      status: warn
      trend: "↑1 this hour"
    - label: Deployments Today
      value: "7"
      trend: "+3 vs yesterday"
    - label: Uptime
      value: "99.9%"
      status: ok
      subtitle: "30-day rolling"
