[project]
name = "rendux"
version = "0.1.0b1"
description = "Config-driven UI shell runtime — RDL declarative layouts for ops/admin apps"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Bryan Tye" }]
keywords = ["rdl", "fastapi", "htmx", "jinja2", "ops", "admin", "declarative-ui"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3.12",
    "Private :: Do Not Upload",
]
dependencies = [
    "fastapi>=0.116.0",
    "httpx>=0.28.0",
    "jinja2>=3.1.0",
    "pydantic-settings>=2.10.0",
    "python-multipart>=0.0.20",
    "pyyaml>=6.0.0",
    "uvicorn[standard]>=0.35.0",
]

[project.urls]
Documentation = "https://github.com/btye8347/rendux#readme"
Repository = "https://github.com/btye8347/rendux"
Changelog = "https://github.com/btye8347/rendux/blob/master/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "hatchling>=1.25.0",
]

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = [
    "/rendux",
    "/contracts",
    "/docs",
    "/examples",
    "/config",
    "/scripts",
    "/demo",
    "/tests",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/pyproject.toml",
]

[tool.hatch.build.targets.wheel]
packages = ["rendux"]

# Bundle repo-root contracts into the installed package for private consumers.
[tool.hatch.build.targets.wheel.force-include]
"contracts" = "rendux/contracts"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
